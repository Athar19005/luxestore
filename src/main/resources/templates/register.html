<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-left">
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80" alt="LUXE Fashion">
        <div class="auth-left-overlay">
            <a href="/" class="logo" style="color:white;">LUXE</a>
            <h2>Join LUXE</h2>
            <p>Create your account and start exploring premium fashion</p>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-form-container">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Already have an account? <a href="/login">Sign In</a></p>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form action="/register" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Min. 6 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" placeholder="Repeat your password" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Create Account →</button>
            </form>
            <div class="divider"><span>or</span></div>
            <a href="/" class="btn btn-outline full-width">Continue as Guest</a>
        </div>
    </div>
</div>
</body>
</html>
