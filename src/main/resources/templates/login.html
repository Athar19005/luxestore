<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-left">
        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&q=80" alt="LUXE Fashion">
        <div class="auth-left-overlay">
            <a href="/" class="logo" style="color:white;">LUXE</a>
            <h2>Welcome Back</h2>
            <p>Sign in to explore our premium fashion collection</p>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-form-container">
            <h2>Sign In</h2>
            <p class="auth-subtitle">Don't have an account? <a href="/register">Register</a></p>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <form action="/login" method="post">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Sign In →</button>
            </form>
            <div class="divider"><span>or</span></div>
            <a href="/" class="btn btn-outline full-width">Continue as Guest</a>
        </div>
    </div>
</div>
</body>
</html>
